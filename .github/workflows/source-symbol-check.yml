name: Native symbol preview check
on:
  push:
    branches: [fix/source-assets-and-compositing]
    paths: [.github/workflows/source-symbol-check.yml]
permissions:
  contents: read
jobs:
  symbols:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gather only referenced private-use symbols
        run: |
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          db=json.loads(gzip.decompress(Path('public/data/geometry.json.gz').read_bytes()))
          codes=set()
          def text(s):
              if not isinstance(s,str): return
              for c in s:
                  n=ord(c)
                  if 0xe000<=n<=0xf8ff or 0xf0000<=n<=0xffffd or 0x100000<=n<=0x10fffd: codes.add(f'{n:X}')
          def walk(n):
              text(n.get('text',{}).get('value'))
              for o in n.get('overrides',[]):
                  if o.get('overrideName','').endswith('_stringValue'): text(o.get('value'))
              for c in n.get('children',[]): walk(c)
          for c in db['components']: walk(c['root'])
          Path('/tmp/symbol-requests.json').write_text(json.dumps(sorted(codes)))
          print('Referenced codepoints:',len(codes))
          PY
      - name: Prepare source typeface only in temporary runner storage
        run: |
          curl -fL --retry 2 'https://devimages-cdn.apple.com/design/resources/download/SF-Pro.dmg' -o /tmp/preview-typeface.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/preview-typeface /tmp/preview-typeface.dmg
          package=$(find /tmp/preview-typeface -name '*.pkg' -maxdepth 3 | head -1)
          pkgutil --expand-full "$package" /tmp/preview-fonts
          hdiutil detach /tmp/preview-typeface
      - name: Render referenced glyphs and reject fallback fonts
        env:
          PREVIEW_FONT_DIRECTORY: /tmp/preview-fonts
        run: |
          mkdir -p /tmp/symbol-preview/artwork
          swift tools/render-native-symbols.swift /tmp/symbol-requests.json /tmp/symbol-preview/artwork /tmp/symbol-preview/symbol-artwork.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/symbol-preview'); m=json.loads((root/'symbol-artwork.json').read_text())
          for glyph in m['glyphs'].values():
              assert not any('lastresort' in s.lower() for s in glyph['fonts'])
              old=root/glyph['url']; digest=hashlib.sha256(old.read_bytes()).hexdigest()
              new=old.with_name(old.stem+'-'+digest[:12]+'.png');old.rename(new)
              glyph['url']=new.relative_to(root).as_posix();glyph['sha256']=digest
          (root/'symbol-artwork.json').write_text(json.dumps(m,separators=(',',':'),sort_keys=True))
          assert len(m['glyphs']) > 200, 'Source typeface did not resolve sufficient glyphs'
          assert not list(root.rglob('*.otf')) and not list(root.rglob('*.ttf')) and not list(root.rglob('*.ttc'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-symbol-preview
          path: /tmp/symbol-preview/
          retention-days: 3
