name: Visual layout review
on:
  push:
    branches: [fix/visual-layout-audit]
    paths: [.github/workflows/visual-layout-review.yml]
permissions:
  contents: write
concurrency:
  group: visual-layout-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore only complete, hash-verified source files
        run: |
          if [ ! -f src/rendering/layout.ts ]; then
            python .maintenance/recover-visual-layout.py
            python .maintenance/fix-visual-probes.py
          fi
      - name: Build reproducible review cases and test
        run: |
          npm ci
          node tests/generate-visual-cases.mjs
          npm run format
          npm run format:check
          npm test
          npm run build
          node tests/material-coverage.mjs
      - name: Install browser engines
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify real production pages and capture reviewed components
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/hig-http.log 2>&1 &
          mkdir -p test-results
          pids=()
          for browser in chromium firefox webkit; do
            focused=()
            if [ "$browser" != chromium ]; then focused+=(--focused); fi
            (python -u tests/visual-review.py --browser "$browser" "${focused[@]}" && python -u tests/browser.py --browser "$browser" && python -u tests/materials-browser.py --browser "$browser") > "test-results/review-$browser.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat test-results/review-*.log
          exit "$failed"
      - name: Save validated source only on the review branch
        run: |
          git add src docs tests tools
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve component layout, clipping and typography in visual previews'
            git push origin HEAD:fix/visual-layout-audit
          fi
      - name: Package reviewed source without temporary upload files
        if: always()
        run: tar -czf /tmp/visual-layout-source.tar.gz src docs tests tools public web scripts package.json package-lock.json vite.config.ts tsconfig.json .prettierrc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-layout-verification
          path: |
            test-results/
            dist/
            /tmp/visual-layout-source.tar.gz
          retention-days: 3
