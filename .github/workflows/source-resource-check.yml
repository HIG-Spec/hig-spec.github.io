name: Source resource check
on:
  push:
    branches: [fix/source-assets-and-compositing]
    paths: [.github/workflows/source-resource-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install playwright
      - name: Inspect publicly available version metadata
        run: |
          python -u - <<'PY'
          import json, shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=shutil.which('google-chrome'),args=['--no-sandbox'])
              page=b.new_page()
              def capture(r):
                  if 'graphql' not in r.url:return
                  try:
                      req=json.loads(r.request.post_data or '{}')
                      if 'Version' in req.get('operationName',''):
                          data=r.json()
                          def clean(v):
                              if isinstance(v,dict):return {k:clean(x) for k,x in v.items() if k not in ['url','url2x','path','downloadUrl','manifestUrl','imageToken','token','avatar','thumbnails']}
                              if isinstance(v,list):return [clean(x) for x in v]
                              return v
                          print('QUERY',r.url,json.dumps(req))
                          print('VERSIONS',json.dumps(clean(data)))
                  except Exception as e:print(type(e).__name__)
              page.on('response',capture)
              page.goto('https://www.sketch.com/s/57153a31-3379-4737-8ac6-dbfd6525f052',wait_until='domcontentloaded')
              page.wait_for_timeout(4000)
              page.get_by_text('Versions',exact=True).click()
              page.wait_for_timeout(4000)
              print('BODY',page.locator('body').inner_text()[:6000])
              b.close()
          PY
