name: Source resource check
on:
  push:
    branches: [fix/source-assets-and-compositing]
    paths: [.github/workflows/source-resource-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install playwright
      - name: Inspect public resource downloads
        run: |
          python -u - <<'PY'
          import json, shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=shutil.which('google-chrome'),args=['--no-sandbox'])
              page=b.new_page()
              def capture(r):
                  if 'graphql' in r.url:
                      try:
                          text=r.text()
                          print('GRAPHQL',r.request.post_data[:500] if r.request.post_data else '',text[:12000])
                      except:pass
              page.on('response',capture)
              for key in ['04c24d8b-38fb-4afb-8836-36617e022f02','57153a31-3379-4737-8ac6-dbfd6525f052']:
                  page.goto('https://www.sketch.com/s/'+key,wait_until='domcontentloaded')
                  page.wait_for_timeout(8000)
                  print('BODY',page.locator('body').inner_text()[:4000])
                  print('LINKS',page.locator('a').evaluate_all('(es)=>es.map(e=>[e.textContent,e.href]).filter(v=>/download|sketch|zip/i.test(v.join()))'))
              b.close()
          PY
