name: Verify all component materials
on:
  push:
    branches: [fix/all-component-materials]
    paths: [.github/workflows/all-materials-check.yml]
permissions:
  contents: write
concurrency:
  group: all-materials-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply reviewed patches
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(''.join(Path(f'.maintenance/all-materials-{i}.b64').read_text().split()) for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 50041
          assert hashlib.sha256(patch).hexdigest() == '68e2532948832f2e6c2a7092bbd1fc73265da9cef4ae6a2968976722d3c9f54c'
          Path('/tmp/all-materials.patch').write_bytes(patch)
          PY
          if [ ! -f tests/all-materials.test.mjs ]; then
            git apply --check /tmp/all-materials.patch
            git apply /tmp/all-materials.patch
          fi
          python .maintenance/complete-border-sides.py
      - name: Install, format and validate source
        run: |
          npm ci
          npm run format
          npm run format:check
          npm test
          npm run build
          node tests/material-coverage.mjs
      - name: Install browser engines
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Check every family and saved material state on the production HTTP build
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/hig-http.log 2>&1 &
          pids=()
          for browser in chromium firefox webkit; do
            (timeout 420 python -u tests/browser.py --browser "$browser" && timeout 420 python -u tests/materials-browser.py --browser "$browser") > "test-results/$browser.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat test-results/*.log
          exit "$failed"
      - name: Save tested source on the review branch only
        run: |
          git add src docs tests tools public/data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify material contours, backdrop effects and child states across all components'
          git push origin HEAD:fix/all-component-materials
      - name: Package verified source
        run: |
          tar -czf /tmp/all-materials-source.tar.gz src docs tests public web scripts tools package.json package-lock.json vite.config.ts tsconfig.json .prettierrc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-materials-verification
          path: |
            test-results/
            dist/
            /tmp/all-materials-source.tar.gz
          retention-days: 3
