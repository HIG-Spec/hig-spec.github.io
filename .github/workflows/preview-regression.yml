name: Preview and material specification tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test symbols, geometry, materials and instance overrides
        run: node --test tests/*.test.cjs
      - name: Check reproducible and idempotent integrations
        run: |
          python tools/apply-symbol-fix.py
          python tools/apply-material-specs.py
          git diff --exit-code
