name: Preview regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run symbol and geometry regression tests
        run: node --test tests/symbols.test.cjs
      - name: Verify the repair is reproducible and idempotent
        run: |
          python tools/apply-symbol-fix.py
          git diff --exit-code
