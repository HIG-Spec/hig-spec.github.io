name: Verify switch rendering
on:
  push:
    branches: [refactor/frontend-glass]
    paths: [.github/workflows/switch-render-check.yml, .staging/switch-preview.patch]
permissions:
  contents: write
concurrency:
  group: switch-preview-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed compositor and annotation repair
        run: |
          echo '359eacc41a0bf4f2d46e165822ab758e56ccffd45d7d4f290d9bb88a8d942534  .staging/switch-preview.patch' | sha256sum --check
          git apply --check .staging/switch-preview.patch
          git apply .staging/switch-preview.patch
      - name: Install, format and validate source
        run: |
          npm ci
          npm run format
          npm run format:check
          npm test
          npm run build
          npm run publish:static
      - name: Install browser engines
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify actual production pages and pixels in all three engines
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/hig-http.log 2>&1 &
          mkdir -p test-results
          pids=()
          for browser in chromium firefox webkit; do
            python -u tests/browser.py --browser "$browser" > "test-results/$browser.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat test-results/*.log
          exit "$failed"
      - name: Save verified sources and static output on the review branch
        run: |
          git add src/rendering/scene.ts src/rendering/geometry.js src/pages/ComponentPage.vue docs/rendering.md tests/frontend.test.mjs tests/browser.py index.html site data favicon.svg .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: render complete glass surfaces in previews and dimension diagrams'
          git push origin HEAD:refactor/frontend-glass
      - name: Package source and built output for visual review
        if: always()
        run: |
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./.staging' --exclude='./test-results' --exclude='./dist' --exclude='./.offline' -czf /tmp/switch-verified-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-render-verification
          path: |
            /tmp/switch-verified-source.tar.gz
            test-results/
          retention-days: 3
