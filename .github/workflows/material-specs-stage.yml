name: Verify material specifications
on:
  push:
    branches: [feat/material-specs]
    paths: [.github/workflows/material-specs-stage.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle before writing files
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          names = ['01', '02', '03', '04a', '04b', '05a', '05b-verified', '06a', '06b', '07a', '07b']
          text = ''.join(''.join(Path(f'.staging/materials-{name}.b64').read_text().split()) for name in names)
          raw = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '38078848509fbc34b867115c799b1eb8ae49e86ab36cc841521156cac92090c7'
          files = json.loads(raw)
          allowed = {'assets/materials-data.js','assets/materials-specs.js','assets/materials-specs.css','tests/materials.test.cjs','tools/apply-material-specs.py','tools/extract-materials.py','docs/material-specs.md','.github/workflows/preview-regression.yml','.gitignore'}
          assert set(files) == allowed
          for path, text in files.items():
              assert isinstance(text, str)
              if path.startswith('.github/'):
                  continue
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          print('Verified source bundle; workflow configuration will be committed separately.')
          PY
      - name: Integrate without changing the geometry payload
        run: python tools/apply-material-specs.py
      - name: Run full regression suite
        run: node --test tests/*.test.cjs
      - name: Stage final content and check idempotence
        run: |
          git add index.html assets/materials-data.js assets/materials-specs.js assets/materials-specs.css tests/materials.test.cjs tools/apply-material-specs.py tools/extract-materials.py docs/material-specs.md .gitignore
          python tools/apply-symbol-fix.py
          python tools/apply-material-specs.py
          git diff --exit-code
      - name: Save verified build to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate validated Liquid Glass material specs and component bindings'
          git push origin HEAD:feat/material-specs
