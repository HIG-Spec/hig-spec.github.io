name: Frontend checks and publishing
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'data/**', 'index.html', 'favicon.svg', '.nojekyll']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit all source materials and build family coverage cases
        run: node tests/material-coverage.mjs
      - name: Install test browsers
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Check production pages, every family, saved states and refraction pixels
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/hig-http.log 2>&1 &
          mkdir -p test-results
          pids=()
          for browser in chromium firefox webkit; do
            (python -u tests/browser.py --browser "$browser" && python -u tests/materials-browser.py --browser "$browser") > "test-results/$browser.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat test-results/*.log
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 3
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: browser-checks
          path: /tmp/source-browser-checks
      - name: Restore family coverage cases for live verification
        run: |
          mkdir -p test-results
          cp /tmp/source-browser-checks/material-coverage.json test-results/material-coverage.json
      - name: Reject stale source builds
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Refresh only generated root files
        run: |
          node scripts/publish-static.mjs
          git add index.html site data favicon.svg .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: publish verified frontend output'
            git push origin HEAD:main
          fi
      - name: Request Pages publication for the generated output
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Wait for the public site to serve this exact build
        run: |
          expected=$(sha256sum dist/index.html | cut -d' ' -f1)
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 20 "https://hig-spec.github.io/?build=$GITHUB_SHA&attempt=$attempt" -o /tmp/published-index.html; then
              actual=$(sha256sum /tmp/published-index.html | cut -d' ' -f1)
              if [ "$actual" = "$expected" ]; then exit 0; fi
            fi
            sleep 10
          done
          echo 'The public site has not yet served the expected HTML.' >&2
          exit 1
      - name: Verify the public deployment and all material families in Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -u tests/browser.py --url "https://hig-spec.github.io/?build=$GITHUB_SHA" --browser chromium
          python -u tests/materials-browser.py --url "https://hig-spec.github.io/?build=$GITHUB_SHA" --browser chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-checks
          path: test-results/
          retention-days: 7
